<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記承天寺夜遊 - 光影解謎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #0b1120; /* 深邃的夜空藍 */
            color: #e2e8f0;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 漸變與動畫效果 */
        .fade-transition {
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
        }
        
        .hidden-scene {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            transform: translateY(20px);
        }

        .active-scene {
            opacity: 1;
            pointer-events: auto;
            position: relative;
            transform: translateY(0);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* 自訂按鈕樣式 */
        .poetic-btn {
            background: transparent;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 12px 32px;
            font-size: 1.125rem;
            letter-spacing: 0.2em;
            border-radius: 9999px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .poetic-btn:hover {
            background: rgba(226, 232, 240, 0.1);
            border-color: #94a3b8;
            color: #f8fafc;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        /* 謎題區塊樣式 */
        #puzzle-area {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
            border-radius: 50%;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 70%);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.05);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shadow-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            letter-spacing: 0.5em;
            writing-mode: vertical-rl;
            text-orientation: upright;
            transition: all 0.1s linear;
        }

        /* 藻荇交橫 (混亂、模糊) */
        #algae-shadow {
            color: #64748b;
            text-shadow: 0 0 10px #64748b;
            transform: rotate(15deg);
        }

        /* 竹柏影 (清晰、對齊) */
        #bamboo-shadow {
            color: transparent;
            text-shadow: 0 0 20px #e2e8f0;
            opacity: 0;
            transform: scale(1.2);
        }

        /* 月光滑桿樣式 */
        input[type=range] {
            -webkit-appearance: none;
            width: 80%;
            max-width: 400px;
            background: transparent;
            margin-top: 2rem;
        }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: #334155;
            border-radius: 1px;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #f1f5f9;
            box-shadow: 0 0 15px #f1f5f9, 0 0 30px #f8fafc;
            margin-top: -11px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        input[type=range]:focus {
            outline: none;
        }

        /* 結局發光文字 */
        .zen-text {
            color: #fef08a;
            text-shadow: 0 0 20px rgba(254, 240, 138, 0.5);
            font-weight: 300;
        }
        
        /* 提示框 */
        #msg-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #475569;
            padding: 15px 30px;
            border-radius: 8px;
            color: #f8fafc;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 50;
            text-align: center;
            min-width: 250px;
        }
    </style>
</head>
<body class="antialiased selection:bg-slate-700 selection:text-white relative">

    <!-- 訊息提示框 (取代 alert) -->
    <div id="msg-box"></div>

    <!-- 容器 -->
    <main class="relative w-full h-full max-w-4xl mx-auto px-6 py-12 flex flex-col items-center justify-center text-center">
        
        <section id="scene-1" class="fade-transition active-scene">
            <h1 class="text-4xl md:text-5xl font-light mb-12 tracking-[0.3em] text-slate-300">元豐六年十月十二日夜</h1>
            <p class="text-xl md:text-2xl leading-loose mb-16 tracking-widest text-slate-400">
                解衣欲睡，月色入戶，<br>欣然起行。
            </p>
            <button onclick="goToScene(2)" class="poetic-btn mt-8">步出房門</button>
        </section>

        <section id="scene-2" class="fade-transition hidden-scene">
            <p class="text-xl md:text-2xl leading-loose mb-12 tracking-widest text-slate-300">
                夜色雖美，念無與為樂者...
            </p>
            <div class="flex flex-col sm:flex-row gap-6 mt-8">
                <button onclick="failEnding()" class="poetic-btn text-slate-500 border-slate-700 hover:text-slate-300">獨自漫步</button>
                <button onclick="goToScene(3)" class="poetic-btn">遂至承天寺尋張懷民</button>
            </div>
        </section>

        <section id="scene-3" class="fade-transition hidden-scene w-full">
            <p id="puzzle-desc" class="text-lg md:text-xl leading-relaxed mb-4 tracking-widest text-slate-300 h-16">
                懷民亦未寢，相與步於中庭。<br>庭下如積水空明...
            </p>
            
            <div id="puzzle-area">
                <!-- 視覺錯視層 -->
                <div id="algae-shadow" class="shadow-layer">
                    <span>水中藻荇交橫</span>
                </div>
                <div id="bamboo-shadow" class="shadow-layer">
                    <span>蓋竹柏影也</span>
                </div>
            </div>

            <p class="text-sm text-slate-500 mt-6 tracking-wider">（撥動月光，尋找庭院積水下的真相）</p>
            <input type="range" id="moon-slider" min="0" max="100" value="0">
        </section>

        <section id="scene-4" class="fade-transition hidden-scene">
            <p class="text-2xl md:text-3xl leading-loose mb-12 tracking-[0.2em] zen-text">
                何夜無月？何處無竹柏？<br>
                但少閑人如吾兩人者耳。
            </p>
            <p class="text-slate-400 mb-16 tracking-widest leading-relaxed">
                你與懷民相視一笑，<br>在這貶謫的歲月裡，得此月夜與知音，足矣。
            </p>
            <button onclick="location.reload()" class="poetic-btn">重溫夜遊</button>
        </section>

    </main>

    <script>
        // DOM 元素
        const scenes = [
            document.getElementById('scene-1'),
            document.getElementById('scene-2'),
            document.getElementById('scene-3'),
            document.getElementById('scene-4')
        ];
        const msgBox = document.getElementById('msg-box');
        const slider = document.getElementById('moon-slider');
        const algaeShadow = document.getElementById('algae-shadow');
        const bambooShadow = document.getElementById('bamboo-shadow');
        const puzzleDesc = document.getElementById('puzzle-desc');
        
        let isPuzzleSolved = false;

        // 顯示提示訊息 (取代 alert)
        function showMessage(msg) {
            msgBox.textContent = msg;
            msgBox.style.opacity = '1';
            setTimeout(() => {
                msgBox.style.opacity = '0';
            }, 3000);
        }

        // 場景切換
        function goToScene(sceneNumber) {
            // 隱藏所有場景
            scenes.forEach(scene => {
                scene.classList.remove('active-scene');
                scene.classList.add('hidden-scene');
            });
            
            // 顯示目標場景
            const targetScene = scenes[sceneNumber - 1];
            targetScene.classList.remove('hidden-scene');
            targetScene.classList.add('active-scene');

            // 如果進入第三幕，初始化滑桿並重置解謎狀態
            if (sceneNumber === 3) {
                isPuzzleSolved = false;
                slider.value = 0;
                updateShadows();
            }
        }

        // 尋友失敗結局
        function failEnding() {
            showMessage("無人共賞此景，心中頓生寂寥，你又回到了榻上。");
            setTimeout(() => {
                location.reload();
            }, 3000);
        }

        // 光影解謎邏輯
        function updateShadows() {
            if (isPuzzleSolved) return;

            const val = parseInt(slider.value, 10);
            const targetValue = 78; // 謎底位置設定在 78
            const distance = Math.abs(val - targetValue);
            
            // 根據距離計算特效數值
            // 距離越近 (distance趨近於0)，藻荇消失，竹柏浮現並變清晰
            
            // 1. 藻荇交橫 (混亂狀態)
            const algaeOpacity = Math.min(1, distance / 30); // 距離>30時完全顯示
            const algaeBlur = 10 - (distance / 5);
            algaeShadow.style.opacity = algaeOpacity;
            algaeShadow.style.filter = `blur(${Math.max(0, algaeBlur)}px)`;
            
            // 旋轉與錯位效果 (模擬水波)
            algaeShadow.style.transform = `rotate(${15 + (distance * 0.5)}deg) skewX(${distance * 0.2}deg)`;

            // 2. 竹柏影 (真相狀態)
            let bambooOpacity = 1 - (distance / 20); // 距離<20開始浮現
            if (bambooOpacity < 0) bambooOpacity = 0;
            
            let bambooBlur = distance * 0.8; // 越近越清晰
            
            bambooShadow.style.opacity = bambooOpacity;
            bambooShadow.style.textShadow = `0 0 ${bambooBlur}px #e2e8f0`;
            bambooShadow.style.transform = `scale(${1 + (distance * 0.01)})`;
            bambooShadow.style.color = distance < 5 ? '#f8fafc' : 'transparent'; // 極接近時顯示實體文字

            // 檢查是否解開謎題
            if (distance === 0) {
                isPuzzleSolved = true;
                slider.disabled = true; // 鎖定滑桿
                puzzleDesc.innerHTML = "水中藻荇交橫，蓋竹柏影也。";
                puzzleDesc.classList.add('text-yellow-100');
                
                // 特效：全白閃爍一下後進入結局
                setTimeout(() => {
                    document.body.style.backgroundColor = '#e2e8f0';
                    setTimeout(() => {
                        document.body.style.backgroundColor = '#0b1120';
                        goToScene(4);
                    }, 500);
                }, 2000);
            }
        }

        // 綁定滑桿事件
        slider.addEventListener('input', updateShadows);
        
        // 初始化
        updateShadows();
    </script>
</body>
</html>
